name: Deploy Cloudflare Worker (Sporty)

on:
  push:
    branches: ["test", "main"]

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Debug vars (test)
        run: |
          echo "::notice::RENDER_URL=${{ vars.RENDER_URL }}"
          echo "::notice::RENDER_API_KEY starts with: ${RENDER_API_KEY:0:3}"
          echo "::notice::CLOUDFLARE_API_TOKEN starts with: ${CLOUDFLARE_API_TOKEN:0:3}"
          echo "::notice::CLOUDFLARE_ACCOUNT_ID starts with: ${CLOUDFLARE_ACCOUNT_ID:0:3}"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        

      - name: Set Worker secrets in Cloudflare (test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            RENDER_API_KEY
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Deploy to test
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy
            --env test
            --var RENDER_URL=${{ vars.RENDER_URL }}
            --var STRIPE_PUBLIC_KEY=${{ vars.STRIPE_PUBLIC_KEY }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install wrangler@4.38.0
        working-directory: frontend

      - name: Set Worker secrets in Cloudflare (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            RENDER_API_KEY
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Deploy to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy
            --env production
            --var RENDER_URL=${{ vars.RENDER_URL }}
            --var STRIPE_PUBLIC_KEY=${{ vars.STRIPE_PUBLIC_KEY }}
