# wrangler.toml — Sporty
name = "sporty"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-09-16"
account_id = "3163c47e268d21d781c4fd86a71964cb"

assets = { directory = "./dist", binding = "ASSETS", exclude = ["_worker.js/**"] }

# --- Default/local (wrangler dev) ---
workers_dev = true  # enables local + a workers.dev preview when not using a specific env

# --- Test (preview env) ---
[env.test]
routes = [
  { pattern = "sporty-test.plyml.com/*", zone_name = "plyml.com" }
]
# Vars & secrets still injected via GitHub Actions for env=test

# --- Production ---
[env.production]
# bind to the real domain
routes = [
  { pattern = "sporty.plyml.com/*", zone_name = "plyml.com" }
]

