frontend:
  worker:
    name: sporty
    assets_dir: site
    main: src/worker.js
    scope: adults_free + logged_in + paid_child
    staging:
      workers_dev: true
    production:
      route: sporty.plyml.com/*
      zone: plyml.com
    secrets:
      - BACKEND_URL
      - BACKEND_API_KEY
      - STRIPE_PUBLIC_KEY
      - SUPABASE_URL
      - SUPABASE_PUBLISHABLE_KEY
      - SUPABASE_STORAGE_URL
backend:
  service: sporty-backend (Render)
  entry: app.main:app
  start: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  env:
    - API_KEY
    - SUPABASE_URL
    - SUPABASE_SECRET_KEY
    - SUPABASE_URL_TEST
    - SUPABASE_SECRET_KEY_TEST
    - STRIPE_SECRET_KEY_TEST
    - STRIPE_SECRET_KEY_LIVE
    - STRIPE_WEBHOOK_SECRET_TEST
    - STRIPE_WEBHOOK_SECRET_LIVE
  test_data:
    synthetic_optimal_bodies: in_progress
api:
  worker_recommend: POST /api/recommend-adult-free
  worker_health: GET /api/healthz
  backend_recommend: POST /recommend-adult-free
  backend_checkout: POST /create-checkout-session (planned)
  backend_webhook: POST /stripe-webhook (planned)
  contract_doc: docs/architecture.md
next:
  supabase:
    auth_and_storage: in_progress
    consent_required_before_persist: true
  payments:
    stripe_checkout: in_progress
    analysis_credits: planned
    billing_products_catalog: seeded_via_taxonomy
